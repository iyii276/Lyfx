<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Iyii FX is an anime editor featuring anime edits, visual effects and creative content.">

    <meta name="keywords"
          content="Iyii FX, Iyii, anime editor, anime edits, video editor, anime editing, AMV, anime videos">

    <meta name="author" content="Iyii">

    <meta name="robots" content="index, follow">

    <link rel="canonical" href="https://iyiifx.netlify.app/">

    <!-- Open Graph -->
    <meta property="og:title" content="IYII FX — Anime Editor & Video Creator">
    <meta property="og:description"
          content="Anime edits, visual effects and creative video content by Iyii.">
    <meta property="og:url" content="https://iyiifx.netlify.app/">
    <meta property="og:type" content="website">

    <!-- Theme -->
    <meta name="theme-color" content="#000000">
    <meta name="google-site-verification" content="bqm5x07YF-2CJQwAMRwJ2A23n_Pn48bDgk6I6xKg6oE" />
    <title>iyii. | Official Links</title>

    <link rel="stylesheet" href="styl.css">
</head>

<body>

    <div class="background">

        <div class="grid"></div>

        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>

        <div class="particles" id="particles"></div>

    </div>


    <!-- Music -->

    <audio id="bgMusic" loop>
        <source src="music.wav" type="audio/mpeg">
    </audio>

    <button id="musicButton" class="music-button">

        <span class="music-bars">
            <i></i>
            <i></i>
            <i></i>
            <i></i>
        </span>

        <span id="musicText">PLAY</span>

    </button>


    <main class="page">

        <section class="content">

            <!-- PROFILE -->

            <div class="profile">

                <div class="avatar-wrap">

                    <div class="avatar-ring"></div>

                    <img
                        src="index.png"
                        alt="iyii"
                        class="avatar"
                    >

                    <span class="online"></span>

                </div>


                <h1>
                    iyii<span>.</span>
                </h1>


                <div class="handle">
                    @iyiifx
                </div>


                <p class="bio">
                    EDITOR • CREATOR • ARTIST
                </p>


                <div class="badge">

                    <span class="pulse-dot"></span>

                    1K+ ON TIKTOK

                </div>

            </div>


            <!-- LINKS -->

            <section
                class="links"
                id="links"
            ></section>


        </section>


        <!-- FOOTER -->

        <footer>

            <div class="footer-line"></div>

            <p>
                © iyii 2026
            </p>

            <span>
                CREATED BY <b>IYII</b>
            </span>

        </footer>

    </main>


    <script src="scrip.js"></script>

</body>
</html>
